
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapCoin</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 20px;
}
.card {
  background: #1d2a40;
  padding: 18px;
  margin: 14px auto;
  border-radius: 18px;
  max-width: 360px;
}
.coin {
  width: 165px;
  height: 165px;
  border-radius: 50%;
  border: 6px solid #ffe17a;
  background: linear-gradient(#ffd84d,#e99a00);
  color: #513400;
  font-size: 65px;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  cursor: pointer;
  box-shadow: 0 0 25px #e99a0066;
}
button {
  background: #ffd34e;
  color: #302300;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
  font-weight: bold;
  width: 100%;
  margin-top: 10px;
}
.small { color: #b8c5d8; }
</style>
</head>
<body>

<h1>🪙 TapCoin</h1>
<p class="small">بزن، جمع کن و ارتقا بده!</p>

<div class="card">
  <p>موجودی سکه</p>
  <h1>🪙 <span id="coins">0</span></h1>
  <div class="coin" onclick="tap()">₿</div>
  <p>قدرت هر کلیک: <b id="power">1</b></p>
  <p>سطح: <b id="level">1</b></p>
</div>

<div class="card">
  <h2>⚡ ارتقای کلیک</h2>
  <p>هزینه: <span id="cost">50</span> سکه</p>
  <button onclick="upgrade()">ارتقا بده</button>
</div>

<div class="card">
  <h2>🎁 جایزهٔ روزانه</h2>
  <p>هر روز یک جایزه دریافت کن!</p>
  <button onclick="daily()">دریافت 100 سکه</button>
  <p id="dailyStatus" class="small"></p>
</div>

<script>
let data;
try {
  data = JSON.parse(localStorage.getItem("tapcoin-save")) || {};
} catch {
  data = {};
}

let coins = Math.max(0, Number(data.coins) || 0);
let power = Math.max(1, Number(data.power) || 1);
let level = Math.max(1, Number(data.level) || 1);
let cost = Math.max(50, Number(data.cost) || 50);
let lastDaily = data.lastDaily || "";

function save() {
  localStorage.setItem("tapcoin-save", JSON.stringify({
    coins, power, level, cost, lastDaily
  }));
}

function render() {
  document.getElementById("coins").textContent =
    Math.floor(coins).toLocaleString("fa-IR");
  document.getElementById("power").textContent =
    power.toLocaleString("fa-IR");
  document.getElementById("level").textContent =
    level.toLocaleString("fa-IR");
  document.getElementById("cost").textContent =
    cost.toLocaleString("fa-IR");
}

function tap() {
  coins += power;
  save();
  render();
}

function upgrade() {
  if (coins < cost) {
    alert("سکه‌هات کافی نیست!");
    return;
  }
  coins -= cost;
  power++;
  level++;
  cost = Math.ceil(cost * 1.7);
  save();
  render();
}

function daily() {
  const today = new Date().toLocaleDateString("en-CA");
  if (lastDaily === today) {
    document.getElementById("dailyStatus").textContent =
      "امروز جایزه‌ات رو گرفتی؛ فردا دوباره بیا!";
    return;
  }
  coins += 100;
  lastDaily = today;
  save();
  render();
  document.getElementById("dailyStatus").textContent =
    "🎉 100 سکه دریافت کردی!";
}

render();
</script>
</body>
</html>
