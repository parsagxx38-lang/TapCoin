
<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

let player = null;
let ready = false;
let lastTick = Date.now();
let tickTimer = null;

const $ = id => document.getElementById(id);
const fmt = n => Math.floor(Number(n) || 0).toLocaleString("fa-IR");

function setText(id, value) {
  const el = $(id);
  if (el) el.textContent = value;
}

function setDisabled(id, value) {
  const el = $(id);
  if (el) el.disabled = value;
}

function status(message, ok = false) {
  const el = $("status");
  if (!el) return;
  el.textContent = message;
  el.classList.toggle("ok", ok);
}

function newPlayer() {
  return {
    coins: 0, power: 1, energy: 500, maxEnergy: 500,
    regen: 1, autoIncome: 0, tapCost: 50, autoCost: 100,
    energyCost: 150, lastDaily: 0,
    username: tg?.initDataUnsafe?.user?.username ||
      tg?.initDataUnsafe?.user?.first_name || "بازیکن"
  };
}

function storageKey() {
  return "tapcoin_local_" +
    (tg?.initDataUnsafe?.user?.id || "guest");
}

function save() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(player));
  } catch (e) {
    console.error("ذخیره ناموفق", e);
  }
}

function load() {
  try {
    const saved = localStorage.getItem(storageKey());
    if (!saved) return newPlayer();

    const p = { ...newPlayer(), ...JSON.parse(saved) };
    p.maxEnergy = Math.max(1, Number(p.maxEnergy) || 500);
    p.energy = Math.max(0, Math.min(p.maxEnergy, Number(p.energy) || 0));
    p.regen = Math.max(1, Number(p.regen) || 1);
    p.coins = Math.max(0, Number(p.coins) || 0);
    p.autoIncome = Math.max(0, Number(p.autoIncome) || 0);
    return p;
  } catch {
    return newPlayer();
  }
}

function render() {
  if (!player) return;

  setText("coins", fmt(player.coins));
  setText("myRankCoins", fmt(player.coins));
  setText("power", fmt(player.power));
  setText("income", fmt(player.autoIncome));
  setText("energyText", fmt(player.energy) + " / " + fmt(player.maxEnergy));
  setText("tapBuy", "🪙 " + fmt(player.tapCost));
  setText("autoBuy", "🪙 " + fmt(player.autoCost));
  setText("energyBuy", "🪙 " + fmt(player.energyCost));
  setText("tapDesc", "قدرت فعلی: " + fmt(player.power) + " سکه در هر کلیک");
  setText("autoDesc", "درآمد: " + fmt(player.autoIncome) + " سکه در ثانیه");
  setText("energyDesc", "شارژ: " + fmt(player.regen) + " انرژی در ثانیه");
  setText("username", player.username);

  const bar = $("energyBar");
  if (bar) {
    bar.style.width = Math.max(0, Math.min(100,
      player.energy / player.maxEnergy * 100)) + "%";
  }

  const wait = 86400000 - (Date.now() - player.lastDaily);
  setText("dailyMsg", player.lastDaily && wait > 0
    ? "زمان باقی‌مانده: " + Math.ceil(wait / 3600000) + " ساعت"
    : "جایزه آماده است!");

  setDisabled("coin", !ready || player.energy < 1);
  setDisabled("tapBuy", !ready || player.coins < player.tapCost);
  setDisabled("autoBuy", !ready || player.coins < player.autoCost);
  setDisabled("energyBuy", !ready || player.coins < player.energyCost);
  setDisabled("dailyBtn", !ready || (player.lastDaily > 0 && wait > 0));
}

function buyUpgrade(type) {
  if (!ready || !player) return;

  const cost = type === "tap" ? player.tapCost :
    type === "auto" ? player.autoCost : player.energyCost;

  if (player.coins < cost) {
    status("سکه کافی نداری!");
    return;
  }

  player.coins -= cost;

  if (type === "tap") {
    player.power++;
    player.tapCost = Math.ceil(player.tapCost * 1.65);
    status("قدرت کلیک افزایش یافت!", true);
  } else if (type === "auto") {
    player.autoIncome++;
    player.autoCost = Math.ceil(player.autoCost * 1.8);
    status("درآمد خودکار افزایش یافت!", true);
  } else {
    player.regen++;
    player.energyCost = Math.ceil(player.energyCost * 1.8);
    status("سرعت شارژ افزایش یافت!", true);
  }

  save();
  render();
}

function on(id, event, handler) {
  const el = $(id);
  if (el) el.addEventListener(event, handler);
}

on("coin", "click", () => {
  if (!ready || !player || player.energy < 1) return;
  player.energy = Math.max(0, player.energy - 1);
  player.coins += player.power;
  save();
  render();
});

on("tapBuy", "click", () => buyUpgrade("tap"));
on("autoBuy", "click", () => buyUpgrade("auto"));
on("energyBuy", "click", () => buyUpgrade("energy"));

on("dailyBtn", "click", () => {
  if (!ready || !player) return;

  if (player.lastDaily && Date.now() - player.lastDaily < 86400000) {
    status("جایزه روزانه هنوز آماده نیست.");
    return;
  }

  player.coins += 100;
  player.lastDaily = Date.now();
  save();
  render();
  status("۱۰۰ سکه دریافت کردی!", true);
});

function inviteLink() {
  return "https://t.me/TappCoiinnBot?start=ref_" +
    (tg?.initDataUnsafe?.user?.id || "invite");
}

on("copyBtn", "click", async () => {
  try {
    await navigator.clipboard.writeText(inviteLink());
    status("لینک دعوت کپی شد!", true);
  } catch {
    window.prompt("لینک دعوت:", inviteLink());
  }
});

on("shareBtn", "click", () => {
  const url = "https://t.me/share/url?url=" +
    encodeURIComponent(inviteLink()) +
    "&text=" + encodeURIComponent("بیا TapCoin بازی کنیم!");

  if (tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, "_blank");
});

document.querySelectorAll(".nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav button").forEach(b =>
      b.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s =>
      s.classList.remove("active"));

    btn.classList.add("active");
    const section = $(btn.dataset.tab);
    if (section) section.classList.add("active");
  });
});

function gameTick() {
  if (!player || !ready) return;

  const now = Date.now();
  const elapsed = Math.min(Math.max((now - lastTick) / 1000, 0), 3600);
  lastTick = now;

  player.energy = Math.min(
    player.maxEnergy,
    player.energy + player.regen * elapsed
  );

  player.coins += player.autoIncome * elapsed;

  render();
  save();
}

player = load();
ready = true;
lastTick = Date.now();
render();
status("شارژ محلی فعال است.", true);

if (tickTimer) clearInterval(tickTimer);
tickTimer = setInterval(gameTick, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    lastTick = Date.now();
    gameTick();
  }
});
</script>
